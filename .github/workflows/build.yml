name: Build preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Compile and test
        run: bash scripts/build.sh
      - name: Package catalog assets
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/package.py --repository "$REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: autolut-preview
          path: dist/*
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: autolut-preview
          path: dist
      - name: Verify tag matches source version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          version = ET.parse('src/Jellyfin.Plugin.AutoLut.csproj').findtext('.//Version')
          assert os.environ['TAG'] == 'v' + version, 'Tag must match source version'
          PY
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --prerelease --title "Auto LUT $TAG (Preview)" --notes-file docs/RELEASE_NOTES.md
      - name: Update fixed plugin catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/update_catalog.py
